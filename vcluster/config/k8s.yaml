# vCluster provider - Kubernetes suite
#
# Imports the provider-agnostic k8s suite from an ai-cloud-validation checkout
# and wires it to the vCluster scripts in ../scripts/k8s/. vCluster runs a
# Virtual Control Plane for each tenant on an existing Kubernetes cluster (the
# control plane cluster). This provider validates the Private Nodes tenancy
# model: dedicated GPU nodes join the tenant's cluster, which runs its own CNI
# (Calico), NVIDIA GPU Operator and DRA driver; nothing runs on, or is synced
# to, the control plane cluster's nodes.
#
# Prerequisites (../README.md has the full list and how to reproduce a run):
#   - vcluster CLI matching VCLUSTER_VERSION, kubectl, helm, jq, python3, curl, ssh
#   - KUBECONFIG pointing at the control plane cluster, which must publish a
#     LoadBalancer Service the worker nodes can reach
#   - a vCluster Platform (the Free tier is enough) and an access key for it:
#     VCLUSTER_PLATFORM_HOST, VCLUSTER_PLATFORM_ACCESS_KEY or _FILE
#   - VCLUSTER_NODES: SSH destinations of the GPU worker nodes (passwordless
#     sudo, a supported OS, no Kubernetes installed); VCLUSTER_NODE_SSH_KEY
#   - NGC_API_KEY for nvcr.io pulls and the NIM workloads
#
# Optional:
#   - VCLUSTER_VERSION         (default: 0.37.6)
#   - VCLUSTER_NAME            (default: acv-tenant)
#   - VCLUSTER_NAMESPACE       (default: vcluster-isv-validation)
#   - VCLUSTER_KUBECONFIG_PATH (default: /tmp/vcluster-isv-validation.kubeconfig)
#   - VCLUSTER_API_ALLOWED_CIDRS (default: the runner's and each node's public
#     IPv4/32) - CIDRs admitted by the tenant API LoadBalancer
#   - VCLUSTER_POD_CIDR, VCLUSTER_SERVICE_CIDR, CALICO_VERSION,
#     GPU_OPERATOR_VERSION, DRA_DRIVER_VERSION
#   - VCLUSTER_OIDC_ISSUER_URL and VCLUSTER_OIDC_PUBLISH_CMD - a public service
#     account issuer for K8sOidcIssuerCheck
#
# Steps from the 1.0.0 k8s suite that this config does not wire (their checks
# report step_not_configured): node pools, reset_gpus, cordon_node,
# pin_control_plane, list_k8s_versions, describe_control_plane_patching, the
# upgrade steps, service_account_iam_test and the
# k8s_{load_balancer,dns_forwarding,cidr_ranges}_test probes.
#
# Usage, from the root of an ai-cloud-validation checkout:
#   KUBECTL="kubectl --kubeconfig=/tmp/vcluster-isv-validation.kubeconfig" \
#     uv run isvctl test run --provider vcluster --suite k8s
#
#   KUBECTL must point at the tenant's cluster so the validations probe it.
#   setup.sh ignores KUBECTL and uses the ambient KUBECONFIG (the control plane
#   cluster). Add --phase setup|test|teardown to run a single phase.

import:
  - isvctl/configs/suites/k8s.yaml

version: "1.0"

commands:
  kubernetes:
    phases: ["setup", "test", "teardown"]
    steps:
      # Creating the tenant, joining the nodes and the GPU Operator's driver
      # build take 15-25 minutes on fresh nodes.
      - name: setup
        phase: setup
        command: "../scripts/k8s/setup.sh"
        timeout: 2700

      - name: teardown
        phase: teardown
        command: "../scripts/k8s/teardown.sh"
        timeout: 600

tests:
  cluster_name: "acv-tenant"
  description: "vCluster validation on NVIDIA GPU nodes"

  validations:
    k8s_network:
      checks:
        K8sApiNetworkAclCheck:
          # Requirement K8S15: the cluster endpoint must provide network access
          # controls. setup.sh exposes the tenant's API through a LoadBalancer
          # whose loadBalancerSourceRanges admit only VCLUSTER_API_ALLOWED_CIDRS:
          # by default the runner and the worker nodes, which reach the API
          # server through it. The authorized probe (kubectl from the runner)
          # must succeed. The unauthorized probe, written by setup.sh next to the
          # tenant's kubeconfig, connects from a pod on the control plane
          # cluster, whose egress address is outside the allowlist, and must be
          # blocked at the network layer. It exits 0 on any HTTP answer, a 401
          # included, so an authentication error never counts as an ACL. It
          # finishes within 95 s and exits 127 if it cannot get a result, which
          # the check reports as a failure, so a hang never passes as blocked.
          probe_timeout_s: 120
          commands:
            unauthorized_probe: "bash ${VCLUSTER_KUBECONFIG_PATH:-/tmp/vcluster-isv-validation.kubeconfig}.acl-probe.sh"

    k8s_observability:
      checks:
        K8sControlPlaneLogsCheck:
          # The Virtual Control Plane runs the API server, scheduler and
          # controller manager in the vCluster pod's syncer container on the
          # control plane cluster, so all three components log there. The pod is
          # selected by label because its name depends on the workload kind the
          # chart picks.
          mode: "command"
          components: ["kube-apiserver", "kube-scheduler", "kube-controller-manager"]
          commands:
            kube-apiserver: "kubectl -n ${VCLUSTER_NAMESPACE:-vcluster-isv-validation} logs -l app=vcluster,release=${VCLUSTER_NAME:-acv-tenant} -c syncer --tail=100 2>/dev/null"
            kube-scheduler: "kubectl -n ${VCLUSTER_NAMESPACE:-vcluster-isv-validation} logs -l app=vcluster,release=${VCLUSTER_NAME:-acv-tenant} -c syncer --tail=100 2>/dev/null"
            kube-controller-manager: "kubectl -n ${VCLUSTER_NAMESPACE:-vcluster-isv-validation} logs -l app=vcluster,release=${VCLUSTER_NAME:-acv-tenant} -c syncer --tail=100 2>/dev/null"

    k8s_workloads:
      checks:
        K8sNcclMultiNodeWorkload:
          # The tenant's control plane is virtual, so no node carries the
          # node-role.kubernetes.io/control-plane label; let the MPI launcher
          # schedule on any node.
          override_launcher_affinity: true
          # Reference environment: two L4 nodes with one GPU each. Match these
          # to your GPU nodes.
          nodes: 2
          gpus_per_node: 1
          # quick_mode uses 1M-256M message range (~30s) instead of 8B-4G (~5m).
          quick_mode: true
          # No NVLink domain between these nodes (setup.sh turns the DRA
          # driver's ComputeDomains off); run NCCL over the pod network.
          use_compute_domain: "false"
          # Allow time for hpc-benchmarks image pull on first run.
          startup_timeout: 600
          timeout: 900
          # Validate that multi-node NCCL all-reduce runs end to end; do not
          # enforce an NVLink/InfiniBand-class bandwidth floor, because the
          # reference nodes are connected only by standard cloud networking.
          # Clusters with InfiniBand or RoCE should set min_bus_bw_gbps.
          min_bus_bw_gbps: 0

        K8sGpuStressWorkload:
          # nvcr.io/nvidia/pytorch:25.04-py3 is ~8 GB; on a cold node the pull
          # alone can exceed the suite default of 300s.
          timeout: 600

        K8sNimInferenceWorkload:
          # L4 (24 GB): cap the context so the KV cache fits next to the 3B
          # model's weights; the default 131072 tokens may not.
          nim_max_model_len: "32768"
          # Cold node: image pull + model download + load + inference.
          timeout: 2700

        K8sNimHelmWorkload-1b:
          nim_max_model_len: "32768"
          timeout: 2700

        K8sNimHelmWorkload-3b:
          nim_max_model_len: "32768"
          timeout: 2700

    k8s_conformance:
      checks:
        K8sCncfConformanceCheck:
          mode: "certified-conformance"
          timeout: 10800
          startup_timeout: 600
          cleanup_namespace: true
          report_individual_tests: false
